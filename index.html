<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>gsplat.js - Local PLY Viewer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #ui {
                position: absolute;
                top: 16px;
                left: 16px;
                z-index: 10;
                color: #fff;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
                pointer-events: none;
            }
            #ui label {
                pointer-events: auto;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 6px;
                backdrop-filter: blur(4px);
            }
            #ui input[type="file"] {
                display: none;
            }
            #progress {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #fff;
                font-family: system-ui, sans-serif;
                font-size: 16px;
                display: none;
            }
            #stats {
                position: absolute;
                top: 16px;
                right: 16px;
                z-index: 10;
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 10px 14px;
                background: rgba(20, 20, 24, 0.72);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 10px;
                backdrop-filter: blur(8px);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
                color: #f0f0f5;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 13px;
                line-height: 1.5;
                pointer-events: none;
                min-width: 130px;
            }
            #stats .row {
                display: flex;
                justify-content: space-between;
                gap: 16px;
            }
            #stats .label {
                color: #a0a0a8;
            }
            #stats .value {
                color: #fff;
                font-weight: 600;
            }
            #stats .value.sh {
                color: #60a5fa;
            }
        </style>
    </head>
    <body>
        <div id="ui">
            <label>
                <span>选择本地 PLY</span>
                <input id="file-input" type="file" accept=".ply" />
            </label>
        </div>
        <div id="stats">
            <div class="row"><span class="label">FPS</span><span class="value" id="fps-value">--</span></div>
            <div class="row"><span class="label">SH</span><span class="value sh" id="sh-value">--</span></div>
        </div>
        <div id="progress">Loading...</div>
        <canvas id="canvas"></canvas>
        <script src="./demo.ts" type="module"></script>
    </body>
</html>
