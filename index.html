<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>splat-shq.js - Local PLY Viewer</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            #progress-container {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: #000;
                color: #fff;
                z-index: 10;
            }
            #progress-container[hidden] {
                display: none;
            }
            #drop-zone {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 32px 48px;
                border: 2px dashed rgba(255, 255, 255, 0.5);
                border-radius: 12px;
                background: rgba(0, 0, 0, 0.7);
                color: #fff;
                text-align: center;
                z-index: 5;
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s;
            }
            #drop-zone:hover,
            #drop-zone.drag-over {
                border-color: #fff;
                background: rgba(0, 0, 0, 0.85);
            }
            #drop-zone input {
                display: none;
            }
            #scene-selector {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 5;
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 8px 12px;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.6);
                color: #fff;
                font-size: 14px;
            }
            #scene-selector select {
                font-size: 14px;
                padding: 4px 8px;
                border-radius: 4px;
                border: none;
                background: #fff;
                color: #000;
            }
            #fps-counter {
                position: absolute;
                top: 12px;
                left: 12px;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.6);
                color: #0f0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 14px;
                pointer-events: none;
                z-index: 5;
            }
            canvas {
                width: 100vw;
                height: 100vh;
                display: block;
            }
        </style>
        <script>
            // [2026-10-13] gh-pages 演示页默认使用"本方法部署臂"。
            //   必须在**任何模块脚本之前**写入 URL：加载器与渲染器都在初始化时读 location.search，
            //   若在模块里再 history.replaceState 已经太晚（loader 读不到 lr=1 会报"低秩载荷缺失"并作废本轮数据）。
            //   默认 shcache=frag&lr=1&nocolortx=1；?arm=full 追加 notx=1（单对象场景才可用，多对象会被渲染器判定作废）；
            //   ?arm=base 关闭全部；URL 里已显式给出任一开关时不覆盖。
            (function () {
                try {
                    var q = new URLSearchParams(location.search);
                    var keys = ["shcache", "lr", "notx", "nocolortx"];
                    var has = keys.some(function (k) {
                        return q.has(k);
                    });
                    var arm = (q.get("arm") || "deploy").toLowerCase();
                    if (has || arm === "base" || arm === "off") return;
                    var u = new URL(location.href);
                    u.searchParams.set("shcache", "frag");
                    u.searchParams.set("lr", "1");
                    u.searchParams.set("nocolortx", "1");
                    if (arm === "full") u.searchParams.set("notx", "1");
                    history.replaceState(null, "", u.toString());
                } catch (e) {
                    /* 保持原行为 */
                }
            })();
        </script>
    </head>
    <body>
        <div id="progress-container" hidden>
            <dialog open id="progress-dialog">
                <p>
                    <label for="progress-indicator">Loading scene...</label>
                </p>
                <progress max="100" id="progress-indicator"></progress>
            </dialog>
        </div>

        <div id="drop-zone">
            <p>Drop a local PLY file here</p>
            <p>or click to browse</p>
            <input id="file-input" type="file" accept=".ply" />
        </div>

        <div id="scene-selector">
            <label for="scene-select">Scene:</label>
            <select id="scene-select">
                <option value="">-- Select a scene --</option>
            </select>
        </div>

        <div id="fps-counter">FPS: 0</div>

        <canvas id="canvas"></canvas>
        <script type="module" src="./demo.ts"></script>
    </body>
</html>
