<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>gsplat.js - Local PLY Viewer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #ui {
                position: absolute;
                top: 16px;
                left: 16px;
                z-index: 10;
                color: #fff;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
                pointer-events: none;
            }
            #ui label {
                pointer-events: auto;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 6px;
                backdrop-filter: blur(4px);
            }
            #ui input[type="file"] {
                display: none;
            }
            #progress {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #fff;
                font-family: system-ui, sans-serif;
                font-size: 16px;
                display: none;
            }
            #fps {
                position: absolute;
                top: 16px;
                right: 16px;
                z-index: 10;
                color: #0f0;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 14px;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="ui">
            <label>
                <span>选择本地 PLY</span>
                <input id="file-input" type="file" accept=".ply" />
            </label>
        </div>
        <div id="fps">FPS: --</div>
        <div id="progress">Loading...</div>
        <canvas id="canvas"></canvas>
        <script src="./demo.ts" type="module"></script>
    </body>
</html>
