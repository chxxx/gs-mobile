name: Build & Deploy to GitHub Pages (pages branch)

on:
    push:
        branches: [main, cleanup/resume-prep]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy-pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build static site (site-dist/)
              # 仅做站点构建；WASM 预编译产物已入库（src/wasm），无需 Emscripten。
              run: npm run site:build

            - name: Deploy site-dist to pages branch (single forced commit)
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  cd site-dist
                  git init -q
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q --allow-empty -m "deploy: update GitHub Pages site from $GITHUB_SHA"
                  git push -q --force \
                      "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                      HEAD:pages
